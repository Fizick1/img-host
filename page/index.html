<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Quizz Auth</title>
    <style>
        body { font-family: Arial, sans-serif; background: #0f0f1a; color: #f0f0f0; display:flex; justify-content:center; align-items:center; height:100vh; }
        .container { background:#1a1a2e; padding:30px; border-radius:12px; width:350px; text-align:center; box-shadow:0 0 20px rgba(0,0,0,0.5);}
        input { width:90%; padding:10px; margin:10px 0; border-radius:6px; border:none; }
        button { padding:10px 20px; border:none; border-radius:6px; background:#4e9af1; color:#fff; cursor:pointer; }
        button:hover { background:#357ae8; }
        .message { margin-top:15px; color:#ff7675; }
        h1 { margin-bottom:20px; font-size:1.5em; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<div class="container">
    <h1 id="title">Quizz Auth</h1>
    <div id="content"></div>
    <div class="message" id="message"></div>
</div>

<script>
    // =========================
    // Настройка Supabase
    // =========================
    const SUPABASE_URL = 'https://ijhppwmsduucmepioyrw.supabase.co/';
    const SUPABASE_ANON_KEY = 'sb_publishable_nowYXjXnaIWZ5hMoZtXaEA_0vFX_aYy'; // Public anon key
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const contentDiv = document.getElementById('content');
    const messageDiv = document.getElementById('message');
    const title = document.getElementById('title');

    // =========================
    // Получаем токен из URL
    // =========================
    const urlHash = window.location.hash; // "#access_token=..."
    const params = new URLSearchParams(urlHash.replace('#','?'));
    const accessToken = params.get('access_token');
    const type = params.get('type'); // "recovery" или "signup"

    // =========================
    // Восстановление пароля
    // =========================
    if (type === 'recovery' && accessToken) {
        title.innerText = "Восстановление пароля";
        contentDiv.innerHTML = `
        <input type="password" id="newPassword" placeholder="Новый пароль" />
        <button id="savePassword">Сохранить пароль</button>
      `;

        document.getElementById('savePassword').addEventListener('click', async () => {
            const newPassword = document.getElementById('newPassword').value;
            if (!newPassword) { messageDiv.innerText = "Введите новый пароль"; return; }

            const { data, error } = await supabase.auth.updateUser(
                { password: newPassword },
                { accessToken }
            );

            if (error) {
                messageDiv.innerText = "Ошибка обновления пароля: " + error.message;
            } else {
                messageDiv.style.color = "#4ef1a3";
                messageDiv.innerText = "Пароль успешно изменён! Можно закрыть страницу.";
                contentDiv.innerHTML = "";
            }
        });

        // =========================
        // Подтверждение почты
        // =========================
    } else if (type === 'signup' && accessToken) {
        title.innerText = "Подтверждение почты";
        contentDiv.innerHTML = `<p>Подтверждаем вашу почту...</p>`;

        (async () => {
            const { data, error } = await supabase.auth.getUser(accessToken);
            if (error) {
                messageDiv.innerText = "Ошибка подтверждения: " + error.message;
            } else {
                messageDiv.style.color = "#4ef1a3";
                messageDiv.innerText = "Почта подтверждена! Теперь можно войти в приложение.";
                contentDiv.innerHTML = "";
            }
        })();

        // =========================
        // Универсальная страница
        // =========================
    } else {
        title.innerText = "Quizz";
        contentDiv.innerHTML = `<p>Откройте ссылку из письма для подтверждения или восстановления пароля</p>`;
    }
</script>
</body>
</html>
