<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quizz Auth</title>
    <style>
        body { font-family: sans-serif; background: #1a1a2e; color: #fff; display:flex; justify-content:center; align-items:center; height:100vh; margin:0; }
        .container { background:#162447; padding:2rem; border-radius:12px; width:90%; max-width:400px; text-align:center; box-shadow:0 0 20px rgba(0,0,0,0.5);}
        h1 { color:#e43f5a; margin-bottom:1rem; }
        p { margin-bottom:1rem; }
        button { padding:0.6rem 1.2rem; border:none; border-radius:6px; background:#e43f5a; color:#fff; font-weight:bold; cursor:pointer; }
        button:disabled { background:#555; cursor:not-allowed; }
        .message { margin-top:1rem; font-size:0.9rem; }
    </style>
</head>
<body>
<div class="container">
    <h1>Quizz Auth</h1>
    <p id="status">Processing...</p>
    <button id="continue" style="display:none;">Continue</button>
    <div class="message" id="message"></div>
</div>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

    const SUPABASE_URL = 'https://ijhppwmsduucmepioyrw.supabase.co/';
    const SUPABASE_ANON_KEY = 'sb_publishable_nowYXjXnaIWZ5hMoZtXaEA_0vFX_aYy'; // Public anon key
    const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const statusEl = document.getElementById('status');
    const messageEl = document.getElementById('message');
    const continueBtn = document.getElementById('continue');

    const hash = window.location.hash.substring(1); // everything after #
    const params = new URLSearchParams(hash);
    const accessToken = params.get('access_token');
    const type = params.get('type'); // "recovery" или "signup"

    async function handleToken() {
        if (!accessToken) {
            statusEl.textContent = 'No token found.';
            messageEl.textContent = 'Open the link from your email to confirm your email or reset your password.';
            return;
        }

        try {
            if (type === 'recovery') {
                statusEl.textContent = 'Resetting your password...';
                const { data, error } = await supabase.auth.updateUser({ access_token: accessToken });
                if (error) throw error;
                statusEl.textContent = 'Password reset successful!';
                messageEl.textContent = 'You can now login with your new password.';
            } else if (type === 'signup') {
                statusEl.textContent = 'Confirming your email...';
                const { data, error } = await supabase.auth.getUser(accessToken);
                if (error) throw error;
                statusEl.textContent = 'Email confirmed!';
                messageEl.textContent = 'You can now login to your Quizz account.';
            } else {
                statusEl.textContent = 'Token detected.';
                messageEl.textContent = 'Processing...';
            }
            continueBtn.style.display = 'inline-block';
            continueBtn.onclick = () => { window.close(); };
        } catch (err) {
            console.error(err);
            statusEl.textContent = 'Error!';
            messageEl.textContent = err.message || 'Something went wrong.';
        }
    }

    handleToken();
</script>
</body>
</html>
